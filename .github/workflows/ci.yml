name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Start development PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Migrate and seed development PostgreSQL
        run: |
          corepack pnpm db:roles
          corepack pnpm db:migrate
          corepack pnpm queue:migrate
          corepack pnpm db:seed

      - name: Verify repository
        env:
          PODGAUGE_RUN_DB_INTEGRATION: '1'
        run: corepack pnpm verify

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run targeted browser smoke
        run: corepack pnpm --filter @podgauge/web exec playwright test --project=chromium

      - name: Validate development Compose
        run: docker compose config --quiet

      - name: Stop development PostgreSQL
        if: always()
        run: docker compose down
