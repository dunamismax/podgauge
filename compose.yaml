name: podgauge-development

# Development-only PostgreSQL service. This file is intentionally not a
# production deployment definition.
services:
  postgres:
    image: postgres:18.4@sha256:f7ce845ee6873dd84be93c9828fe0d1fab0f9707dc9ac569694657398b290bce
    restart: unless-stopped
    # This login bootstraps development roles only. Application and migration
    # commands never use it as DATABASE_URL.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podgauge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podgauge_dev_only}
      POSTGRES_USER: ${POSTGRES_USER:-podgauge}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - '127.0.0.1:54329:5432'
    networks:
      - development
    volumes:
      - postgres-data:/var/lib/postgresql

networks:
  development:
    driver: bridge

volumes:
  postgres-data:
